<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>Code Hunting Games certificate</title>

    <style>
html, body {
    margin: 0;
    padding: 0;
    font-family: 'DejaVu Sans', 'Arial', sans-serif;
    font-weight: 500;
    font-size: 26pt;
    background: rgb(255,255,255);
    -webkit-print-color-adjust: exact;
    box-sizing: border-box;
    width: 297.0mm;
    height: 210.0mm;
}
.background {
    position: absolute;
    top: 0;
    left: 0;
    width: 297mm;
    height: 210mm;
}
.page {
    position: absolute;
    padding: 10mm;
    width: 277.0mm;
    height: 190.0mm;
}
.header {
    margin-top: 44mm;
    height: 10mm;
    text-align: center;
}
.header img {
    height: auto;
}
.content {
    margin-top: 12mm;
    padding: 0 2em;
    text-align: center;
    line-height: 1.2;
}
.content .big {
    display: block;
    margin: 5mm 0;
    font-size: 34pt;
    font-weight: bold;
    white-space: nowrap;
    line-height: 0.9;
}
    </style>
</head>
<body>
    <img src="/html2pdf/images/inaf-certificate.jpg" class="background" />

    <div class="page">
        <div class="header">
            <img src="/html2pdf/images/title.png" style="width: 150mm" />
        </div>

        <div class="content">
            <div class="big">%TEAM_NAME%</div>
            <div>for completing the</div>
            <div class="big">Worldwide Astrophysical<br /><i>Code Hunting Game</i></div>
            <div>on %DATE% in %ELAPSED_MINS% minutes</div>
        </div>
    </div>

    <img src="/data/avatars/%AVATAR_NAME%" style="position: absolute; width: 34mm; height: auto; max-height: 70mm; top: 47mm; left: 30mm" />
</body>
</html>
