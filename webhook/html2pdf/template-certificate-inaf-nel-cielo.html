<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>Code Hunting Games certificate</title>

    <style>
html, body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    font-weight: normal;
    font-size: 32pt;
    background: rgb(255,255,255);
    -webkit-print-color-adjust: exact;
    box-sizing: border-box;
    width: 297mm;
    height: 210mm;
}
.background {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 297mm;
    height: 210mm;
}
.page {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10mm;
    width: 277mm;
    height: 190mm;
}
.overlay {
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    width: 297.0mm;
    height: 210.0mm;
    background-image: url('/html2pdf/images/bubbles-50.png');
    background-repeat: no-repeat;
}
.left-overlay {
    background-position: -90mm 0;
}
.right-overlay {
    background-position: 170mm -120mm;
}
.content {
    width: 217mm;
    margin-top: 54mm;
    padding: 0 30mm;
    text-align: center;
    line-height: 1.2;
}
.content .subtitle {
    font-size: 20pt;
    margin-bottom: 12mm;
    font-weight: bold;
    opacity: 0.7;
}
.content span.nowrap {
    white-space: nowrap;
}
.content .team-name {
    margin-bottom: 8mm;
    letter-spacing: 0.05rem;
}
.content .game-name {
    margin: 8mm 0;
}
.content .big {
    font-size: 46pt;
    font-weight: bold;
}
    </style>
</head>
<body>
    <img src="/html2pdf/images/inaf-nel-cielo-certificate.jpg" class="background" />

    <div class="page">
        <div class="content">
            <div class="subtitle">Certificato di completamento</div>
            <div class="big team-name"><span class="nowrap">%TEAM_NAME%</span></div>
            <div>ha completato con successo l’attività</div>
            <div class="big game-name"><span class="nowrap">Code Hunting Game</span> nel cielo</div>
            <div>in&nbsp;%ELAPSED_MINS% minuti, il giorno &nbsp;%DATE%.</div>
        </div>
    </div>

    <img src="/data/avatars/%AVATAR_NAME%" style="position: absolute; width: 40mm; height: auto; max-height: 70mm; top: 20mm; left: 18mm" />
</body>
</html>
