<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>Code Hunting Games certificate</title>

    <style>
html, body {
    margin: 0;
    padding: 0;
    font-family: 'DejaVu Sans', 'Arial', sans-serif;
    font-weight: 300;
    font-size: 30pt;
    background: rgb(255,255,255);
    -webkit-print-color-adjust: exact;
    box-sizing: border-box;
    width: 297mm;
    height: 210mm;
}
.background {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 297mm;
    height: 210mm;
}
.page {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10mm;
    width: 277mm;
    height: 190mm;
}
.overlay {
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    width: 297.0mm;
    height: 210.0mm;
    background-image: url('/html2pdf/images/bubbles-50.png');
    background-repeat: no-repeat;
}
.left-overlay {
    background-position: -90mm 0;
}
.right-overlay {
    background-position: 170mm -120mm;
}
.header {
    margin-top: 32mm;
    height: 50mm;
    text-align: center;
}
.header img {
    margin-top: 10mm;
    height: auto;
}
.content {
    position: absolute;
    top: 75mm;
    padding: 0 40mm;
    text-align: center;
    line-height: 1.15;
}
.content .big {
    display: block;
    margin: 0;
    font-size: 38pt;
    font-weight: 500;
    white-space: nowrap;
}
    </style>
</head>
<body>
    <img src="/html2pdf/images/inaf-nel-cielo-certificate.jpg" class="background" />

    <div class="page">
        <div class="header">

        </div>

        <div class="content">
            <div class="big"><span class="nowrap">%TEAM_NAME%</span></div>
            <div>for completing the</div>
            <div class="big"><span class="nowrap">Worldwide Astrophysical</span><br /><span class="nowrap">Code Hunting Game</span></div>
            <div>in&nbsp;%ELAPSED_MINS% minutes on&nbsp;%DATE%</div>
        </div>
    </div>

    <img src="/data/avatars/%AVATAR_NAME%" style="position: absolute; width: 40mm; height: auto; max-height: 70mm; top: 48mm; left: 22mm" />
</body>
</html>
