; Xdebug 3 configuration for devcontainer
; Loaded after docker-php-ext-xdebug.ini (which only sets zend_extension=xdebug)

; Enable debug mode (step debugging + develop helpers)
xdebug.mode = debug,develop

; Start debugging on every request (CLI and HTTP)
xdebug.start_with_request = yes

; VS Code listens on port 9003 (Xdebug 3 default)
xdebug.client_port = 9003

; Point back to the Docker host where VS Code runs
xdebug.client_host = host.docker.internal

; Increase the connection timeout for slow dev environments
xdebug.connect_timeout_ms = 2000

; Better stack traces and var_dump output
xdebug.file_link_format = vscode://file/%f:%l
