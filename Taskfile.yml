version: '3'

dotenv: ['config.env']

vars:
  DC: docker compose -f docker-compose.yml -f docker-compose.deploy.yml -p {{.COMPOSE_PROJECT_NAME}}
  DC_RUN: '{{.DC}} run --rm'

tasks:
  cmd:
    desc: Show the docker-compose command
    cmds:
      - echo 'Docker-Compose command:'
      - echo '{{.DC}}'

  install:
    desc: Install the database schema
    cmds:
      - '{{.DC_RUN}} db-client mysql -h db -u {{.MYSQL_USER}} -p{{.MYSQL_PASSWORD}} {{.MYSQL_DATABASE}} < sql/treasurehuntbot.sql'

  mysql:
    desc: Open an interactive MySQL shell
    cmds:
      - '{{.DC_RUN}} db-client mysql -h db -u {{.MYSQL_USER}} -p{{.MYSQL_PASSWORD}} {{.MYSQL_DATABASE}}'
    interactive: true

  mysql-cmd:
    desc: Show the MySQL connection command
    cmds:
      - echo '{{.DC_RUN}} db-client mysql -h db -u {{.MYSQL_USER}} -p{{.MYSQL_PASSWORD}} {{.MYSQL_DATABASE}}'

  dump:
    desc: Export the database to dump.sql
    cmds:
      - '{{.DC_RUN}} db-client mysqldump -h db -u root -p{{.MYSQL_ROOT_PASSWORD}} {{.MYSQL_DATABASE}} --extended-insert=FALSE > dump.sql'
      - echo 'Database exported to dump.sql.'

  import-db:
    desc: Replace the database with contents from dump.sql
    prompt: Are you sure you want to replace the database?
    cmds:
      - test -f dump.sql
      - echo 'Replacing database with contents from file dump.sql...'
      - '{{.DC_RUN}} db-client mysqldump -h db -u {{.MYSQL_USER}} -p{{.MYSQL_PASSWORD}} {{.MYSQL_DATABASE}} > previous_dump.sql'
      - '{{.DC_RUN}} db-client mysql -h db -u {{.MYSQL_USER}} -p{{.MYSQL_PASSWORD}} {{.MYSQL_DATABASE}} < dump.sql'
      - echo 'Database replaced. Previous contents in previous_dump.sql.'

  up:
    desc: Start the proxy service
    cmds:
      - '{{.DC}} up -d proxy'
      - '{{.DC}} ps'

  ps:
    desc: Show container status
    cmds:
      - '{{.DC}} ps'

  rs:
    desc: Restart all services
    cmds:
      - '{{.DC}} restart'

  rebuild:
    desc: Rebuild and restart the webhook service
    cmds:
      - '{{.DC}} rm -sf proxy webhook'
      - '{{.DC}} build webhook'
      - '{{.DC}} up -d proxy'

  phpmyadmin:
    desc: Run phpMyAdmin (CTRL+C to stop)
    cmds:
      - echo 'Running phpMyAdmin, terminate with CTRL+C...'
      - '{{.DC}} up database-manager'

  stop:
    desc: Stop all services
    cmds:
      - '{{.DC}} stop'

  rm:
    desc: Stop and remove all containers
    aliases: [rmc]
    deps: [stop]
    cmds:
      - '{{.DC}} rm -f'

  logs:
    desc: Follow webhook logs
    cmds:
      - docker logs -f "$({{.DC}} ps -q webhook)"
